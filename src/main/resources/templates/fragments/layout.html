<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title,content)">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title th:text="${title} + ' — OpenCloud'">OpenCloud</title>

  <link rel="stylesheet" th:href="@{/css/main.css}" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css" />
</head>

<body>

  <div class="layout">

    <!-- HEADER -->
    <header class="masthead">

      <div class="masthead-brand">
        <i class="ri-cloud-line"></i>
        OpenCloud
      </div>

      <div class="masthead-user">
        <span class="env-tag">Production</span>
      </div>

    </header>


    <!-- BODY -->
    <div class="body-row" style="min-height:calc(100vh - 56px);">


      <!-- SIDEBAR -->
      <aside class="sidebar" style="
        width:280px;
        min-width:280px;
        max-width:280px;
        flex:0 0 280px;
        height:calc(100vh - 56px);
        position:fixed;
        left:0;
        top:56px;
        bottom:0;
        display:flex;
        flex-direction:column;
        overflow-y:auto;
        overflow-x:hidden;
        box-sizing:border-box;
        z-index:150;
      ">

        <nav class="nav">

          <!-- Dashboard -->
          <a th:href="@{/dashboard}"
            th:classappend="${currentUri != null and #strings.contains(currentUri, '/dashboard') ? 'active' : ''}">
            <i class="ri-dashboard-line"></i>
            Home
          </a>


          <!-- Servers -->
          <a th:href="@{/servers}"
            th:classappend="${currentUri != null and #strings.contains(currentUri, '/servers') ? 'active' : ''}">
            <i class="ri-server-line"></i>
            Servers
          </a>


          <!-- Deployments -->
          <a th:href="@{/deployments}"
            th:classappend="${currentUri != null and #strings.contains(currentUri, '/deployments') ? 'active' : ''}">
            <i class="ri-rocket-2-line"></i>
            Deployment
          </a>


          <!-- Users & Permissions -->
          <a th:href="@{/users}"
            th:classappend="${currentUri != null and #strings.contains(currentUri, '/users') ? 'active' : ''}">
            <i class="ri-shield-user-line"></i>
            Permission
          </a>


          <!-- Support -->
          <a th:href="@{/support}"
            th:classappend="${currentUri != null and #strings.contains(currentUri, '/support') ? 'active' : ''}">
            <i class="ri-customer-service-2-line"></i>
            Support
          </a>


          <!-- Account -->
          <a th:href="@{/account}"
            th:classappend="${currentUri != null and #strings.contains(currentUri, '/account') ? 'active' : ''}">
            <i class="ri-user-settings-line"></i>
            Account
          </a>

        </nav>


        <!-- LOGOUT -->
        <div style="
          margin-top:auto;
          padding:0 16px 10px;
          flex-shrink:0;
        ">

          <form th:action="@{/logout}" method="post" style="margin:0;">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <button type="submit" style="
              width:100%;
              display:flex;
              align-items:center;
              gap:10px;
              padding:12px 14px;
              border:1px solid rgba(201,25,11,0.35);
              border-radius:5px;
              background:rgba(201,25,11,0.10);
              color:#C9190B;
              font-family:inherit;
              font-size:14px;
              font-weight:600;
              cursor:pointer;
              box-shadow:0 2px 6px rgba(0,0,0,0.12);
              transition:all .15s ease;
            " onmouseover="
              this.style.background='rgba(201,25,11,0.18)';
              this.style.borderColor='#C9190B';
            " onmouseout="
              this.style.background='rgba(201,25,11,0.10)';
              this.style.borderColor='rgba(201,25,11,0.35)';
            ">

              <i class="ri-logout-box-r-line" style="font-size:18px;"></i>

              <span>Logout</span>

            </button>

          </form>

        </div>

      </aside>


      <!-- MAIN CONTENT -->
      <main class="content-col" style="
        margin-left:280px;
        width:calc(100% - 280px);
        max-width:calc(100% - 280px);
        min-width:0;
        min-height:calc(100vh - 56px);
        overflow-x:hidden;
        box-sizing:border-box;
      ">


        <!-- PAGE HEADER -->
        <div class="page-header">

          <div class="breadcrumb">
            OpenCloud
            <span class="sep">/</span>
            <span th:text="${title}">Overview</span>
          </div>

          <h1 th:text="${title}">
            Overview
          </h1>

        </div>


        <!-- PAGE CONTENT -->
        <div class="page-body" th:insert="${content}">
        </div>


      </main>

    </div>

  </div>
  <script th:src="@{/js/app.js}"></script>

</body>

</html>
