<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title,content)">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${title} + ' — OpenCloud'">OpenCloud</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css" />
</head>

<body>
  <div class="layout">

    <!-- Masthead -->
    <header class="masthead">
      <div class="masthead-brand">
        <i class="ri-cloud-line"></i>
        OpenCloud
      </div>
      <div class="masthead-user">
        <span class="env-tag">Production</span>
        <form th:action="@{/logout}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" class="btn btn-ghost" style="background:transparent;border-color:#3c3f42;color:#d2d2d2">
            <i class="ri-logout-box-r-line"></i> Logout
          </button>
        </form>
      </div>
    </header>

    <div class="body-row">
      <!-- Left nav -->
      <aside class="sidebar">
        <nav class="nav">
          <a th:href="@{/dashboard}"
            th:classappend="${currentUri != null and #strings.contains(currentUri, '/dashboard') ? 'active' : ''}">
            <i class="ri-dashboard-line"></i> Overview
          </a>
          <a th:href="@{/servers}"
            th:classappend="${currentUri != null and #strings.contains(currentUri, '/servers') ? 'active' : ''}">
            <i class="ri-server-line"></i> Servers
          </a>
          <a th:href="@{/deployments}"
            th:classappend="${currentUri != null and #strings.contains(currentUri, '/deployments') ? 'active' : ''}">
            <i class="ri-rocket-2-line"></i> Deployments
          </a>
          <a th:href="@{/users}"
            th:classappend="${currentUri != null and #strings.contains(currentUri, '/users') ? 'active' : ''}">
            <i class="ri-team-line"></i> Users &amp; Permissions
          </a>
          <a th:href="@{/account}"
            th:classappend="${currentUri != null and #strings.contains(currentUri, '/account') ? 'active' : ''}">
            <i class="ri-user-settings-line"></i> Account
          </a>
        </nav>
      </aside>

      <!-- Main content column -->
      <main class="content-col">
        <div class="page-header">
          <div class="breadcrumb">OpenCloud <span class="sep">/</span> <span th:text="${title}">Overview</span></div>
          <h1 th:text="${title}">Overview</h1>
        </div>
        <div class="page-body" th:insert="${content}"></div>
      </main>
    </div>
  </div>

  <script th:src="@{/js/app.js}"></script>
</body>
</html>
