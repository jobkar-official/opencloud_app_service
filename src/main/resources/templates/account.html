<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Account', ~{::content})}">
<div th:fragment="content" style="max-width:520px">
  <div class="card">
    <h3 style="margin-top:0">Profile</h3>
    <div th:if="${user != null}">
      <label>Name</label>
      <div style="font-size:14px;margin-bottom:12px" th:text="${user.displayName}">Obaidur Rahman</div>
      <label>Email</label>
      <div class="mono" style="font-size:13px;margin-bottom:12px" th:text="${user.email}">rahman@opencloud.dev</div>
      <label>Role</label>
      <div><span class="badge badge-building" th:text="${user.role}">OWNER</span></div>
    </div>
    <p th:if="${user == null}" style="color:var(--muted)">Could not load your profile.</p>
  </div>

  <div class="card" style="margin-top:16px">
    <h3 style="margin-top:0">Session</h3>
    <p style="color:var(--muted);font-size:13px">Signed in via session-based form login.</p>
    <form th:action="@{/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <button type="submit" class="btn btn-ghost">Sign out</button>
    </form>
  </div>
</div>
</html>
