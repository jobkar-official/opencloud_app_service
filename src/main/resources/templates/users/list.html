<html xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout('Users &amp; Permissions', ~{::content})}">
<div th:fragment="content">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <p style="color:var(--muted);margin:0">Everyone with access to this OpenCloud account.</p>
    <button type="button" class="btn btn-primary" onclick="document.getElementById('inviteModal').style.display='flex'">
      <i class="ri-user-add-line"></i> Invite user
    </button>
  </div>

  <div class="card" style="padding:0">
    <table class="table">
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Permission</th>
        <th>Status</th>
        <th></th>
      </tr>
      <tr th:each="u : ${team}">
        <td th:text="${u.displayName}">Obaidur Rahman</td>
        <td class="mono" style="font-size:12.5px" th:text="${u.email}">rahman@opencloud.dev</td>
        <td>
          <span th:if="${u.role.name()=='OWNER'}" class="badge badge-building">OWNER</span>
          <form th:unless="${u.role.name()=='OWNER'}" th:action="@{'/users/' + u.id + '/permission'}" method="post"
            style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <select name="role" onchange="this.form.submit()" style="width:auto;padding:6px 10px;font-size:12.5px">
              <option value="ADMIN" th:selected="${u.role.name()=='ADMIN'}">Admin</option>
              <option value="DEVELOPER" th:selected="${u.role.name()=='DEVELOPER'}">Developer</option>
              <option value="VIEWER" th:selected="${u.role.name()=='VIEWER'}">Viewer</option>
            </select>
          </form>
        </td>
        <td>
          <span class="badge"
            th:classappend="${u.status.name()=='ACTIVE'?'badge-live':(u.status.name()=='INVITED'?'badge-building':'badge-failed')}"
            th:text="${u.status}">ACTIVE</span>
        </td>
        <td>
          <form th:if="${u.role.name()!='OWNER'}" th:action="@{'/users/' + ${u.id} + '/remove'}" method="post"
            onsubmit="return confirm('Remove this user?')">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn"
              style="background:#faeae8;color:#c9190b;padding:6px 12px;font-size:12px">Remove</button>
          </form>
        </td>
      </tr>
    </table>
  </div>

  <div id="inviteModal"
    style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);align-items:center;justify-content:center;z-index:100">
    <div class="card" style="width:400px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0">Invite a user</h3>
        <button type="button" onclick="document.getElementById('inviteModal').style.display='none'"
          style="background:none;border:0;cursor:pointer;font-size:18px">&times;</button>
      </div>
      <form th:action="@{/users/invite}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label>Email</label>
        <input type="email" name="email" placeholder="teammate@company.com" required="required" />
        <label style="margin-top:10px">Permission</label>
        <select name="role">
          <option value="ADMIN">Admin</option>
          <option value="DEVELOPER" selected="selected">Developer</option>
          <option value="VIEWER">Viewer</option>
        </select>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:14px">Send
          invite</button>
      </form>
    </div>
  </div>
</div>

</html>
